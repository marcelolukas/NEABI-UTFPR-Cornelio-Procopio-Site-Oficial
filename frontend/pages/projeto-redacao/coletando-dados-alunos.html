<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coletando Dados Alunos</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/transicao.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style-redacao.css" />
  </head>

  <body>
    <div class="div_transicao"></div>

    <header class="cabecalho">
      <div class="identidade_do_site">
        <img
          class="logo_do_site"
          src="../../assets/site/logoDoSite.png"
          alt="Logo do Site"
        />
      </div>

      <nav class="navegacao">
        <ul class="menu-pagina-inicial">
          <li><a href="../../index.html">Início</a></li>
          <li><a href="../template_quem_somos.html">Quem Somos</a></li>
          <li><a href="../ver_todas.html">Projetos</a></li>
          <li><a href="../eventos.html">Eventos</a></li>
        </ul>
      </nav>

      <a href="#" class="botao-contato">
        <span class="texto-botao">Fale Conosco</span>
        <video
          class="icone-punho"
          src="../../assets/ui/animacao_punho.webm"
          muted
          playsinline
          preload="auto"
        ></video>
      </a>
    </header>

    <main class="pagina-formulario">
      <section class="container-formulario">
        <section class="header">
          <h2>Conte um pouco sobre você!</h2>
          <p>
            Queremos conhecer você melhor para apresentar uma mulher que
            compartilha sonhos e experiências parecidas com as suas.
          </p>
        </section>

       <form id="formulario" class="form">
          <div class="form-content">
            
            <div class="campo-formulario campo-curto">
              <label for="nome-aluno">Qual é o seu nome?</label>
              <input
                type="text"
                id="nome-aluno"
                name="nome"
                required
                placeholder="Digite seu nome"
              />
            </div>

            <div class="campo-formulario">
              <label>Selecione todas as opções que combinam com você:</label>
              
              <div class="container-tags">
                <button type="button" class="tag-selecionavel" data-value="comunicacao">🗣️ Gosto de falar e debater</button>
                <button type="button" class="tag-selecionavel" data-value="ciencia">🔬 Adoro ciências e experimentos</button>
                <button type="button" class="tag-selecionavel" data-value="lideranca">👑 Gosto de liderar grupos</button>
                <button type="button" class="tag-selecionavel" data-value="arte">🎨 Sou criativo(a) e gosto de arte</button>
                <button type="button" class="tag-selecionavel" data-value="justica">⚖️ Luto contra injustiças</button>
                <button type="button" class="tag-selecionavel" data-value="natureza">🌱 Gosto de cuidar do meio ambiente</button>
                <button type="button" class="tag-selecionavel" data-value="tecnologia">💻 Curto tecnologia e computadores</button>
                <button type="button" class="tag-selecionavel" data-value="escrita">✍️ Gosto de ler e escrever</button>
              </div>
            </div>

            <div class="acoes-formulario">
              <button type="submit" class="botao-enviar">
                <i class="fa-solid fa-paper-plane"></i>
                Descobrir minha compatibilidade
              </button>
            </div>

          </div>
        </form>
      </section>
    </main>


    <script src="../projeto-redacao/formulario.js"></script>
    <script src="../../scripts/transicao.js"></script>
    <script src="../../scripts/animacoes.js"></script>
  </body>
</html>
